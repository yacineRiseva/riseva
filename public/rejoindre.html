<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riseva, rejoindre mon entreprise</title>
<link rel="icon" href="/brand/riseva-mark.png">
<link rel="stylesheet" href="/styles/polices.css">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<div id="root"></div>
<script type="module">
import { DB, BAREME } from "/app/data.js";
import { h, esc, nb, toast } from "/app/ui.js";

const code = new URLSearchParams(location.search).get("code") || "";
const root = document.getElementById("root");

const reseau = DB.impactReseau();

const cadre = (contenu) => h(`<div class="login">
  <aside class="login__aside grain">
    <div class="login__lueur" aria-hidden="true"></div>
    <svg class="login__river" viewBox="0 0 520 300" aria-hidden="true">
      <path d="M0 220 C 110 120, 190 270, 300 180 S 450 70, 520 150" fill="none" stroke="var(--lime)" stroke-width="4"/>
      <path d="M0 265 C 120 165, 200 305, 320 220 S 460 120, 520 195" fill="none" stroke="var(--brand)" stroke-width="4" opacity=".55"/>
    </svg>
    <img src="/brand/riseva-full-white.png" alt="Riseva">
    <div style="position:relative">
      <h2 style="color:var(--paper);max-width:15ch">Votre entreprise joue la saison.</h2>
      <p style="margin-top:var(--s5);color:rgba(223,230,208,.62);max-width:38ch">
        Des associations publient de vrais besoins près de chez vous. Vous y répondez quand
        vous voulez, et chaque action compte pour votre entreprise.</p>
      <ul class="login__formats">
        ${Object.values(BAREME).map(b => `<li>
          <span class="login__ic"></span>
          <span class="login__lab">${esc(b.label)}</span>
          <span class="login__pts mono">+${nb(b.points)}</span></li>`).join("")}
      </ul>
      <p class="login__note">Vous choisissez ce que vous faites, et quand. Personne ne vous
        désigne, et se retirer ne demande aucune justification. Ce que vous donnez à titre
        personnel n'est jamais montré à votre employeur.</p>
    </div>
    <div class="login__pied">
      <div class="login__chiffres">
        <div><b>${nb(reseau.associations || 0)}</b><span>associations vérifiées</span></div>
        <div><b>${nb(reseau.missions || 0)}</b><span>missions confirmées</span></div>
        <div><b>${nb(reseau.heures || 0)}</b><span>heures de bénévolat</span></div>
      </div>
      <p style="font-size:var(--t-xs);color:rgba(223,230,208,.62);margin-top:var(--s5)">
        © 2026 Riseva</p>
    </div>
  </aside>
  <div class="login__form"><div class="login__box" id="boite"></div></div>
</div>`);

const el = cadre();
root.appendChild(el);
const boite = el.querySelector("#boite");

const inv = DB.invitationParCode(code);
const ent = inv ? DB.entreprise(inv.entreprise) : null;
const restantesLien = inv ? inv.places - inv.utilisees : 0;
/* Un lien de site consomme le quota de son site, pas celui du pot commun : sinon
   le premier établissement servi mange les places des autres. */
const etab = inv && inv.etablissement ? DB.etablissement(inv.etablissement) : null;
const si = inv ? DB.sieges(inv.entreprise, { etablissement: inv.etablissement || null }) : null;

function erreur(titre, texte){
  boite.innerHTML = "";
  boite.appendChild(h(`<div>
    <span class="badge badge--danger" style="height:28px">Lien inutilisable</span>
    <h1 style="margin-top:var(--s5);font-size:var(--t-h2)">${esc(titre)}</h1>
    <p class="muted" style="margin-top:var(--s4)">${esc(texte)}</p>
    <a class="btn btn--ghost" style="margin-top:var(--s8)" href="/">Retour au site</a>
  </div>`));
}

if (!code)        erreur("Il manque le code", "Demandez à votre entreprise le lien d'inscription complet, il se termine par un code.");
else if (!inv)    erreur("Ce code n'existe pas", "Vérifiez le lien, ou demandez à votre entreprise de vous le renvoyer.");
else if (!inv.active) erreur("Ce lien a été désactivé", "Votre entreprise l'a révoqué. Elle peut vous en fournir un nouveau.");
/* Le quota de places compte les salariés. Un accès de référent ou de CSE n'en
   consomme pas : refuser un élu parce que l'entreprise a rempli ses sièges
   reviendrait à lui faire payer des comptes qu'il n'utilise pas. */
else if (!inv.pour_cse && !inv.pour_referent && (restantesLien <= 0 || si.restants <= 0))
                  erreur("Toutes les places sont prises", "L'abonnement de votre entreprise est complet. Parlez-en à la personne qui gère Riseva chez vous.");
/* L'accès du CSE : nominatif lui aussi, et en lecture seule. On dit ce qu'il ouvre
   et surtout ce qu'il n'ouvre pas, un élu qui découvrirait après coup qu'il ne voit
   pas les noms se demanderait ce qu'on lui cache, alors que c'est exactement
   l'inverse. */
else if (inv.pour_cse){
  boite.appendChild(h(`<div>
    <p class="eyebrow">Comité social et économique</p>
    <h1 style="margin-top:var(--s4);font-size:var(--t-h2)">Lire les chiffres de ${esc(ent.nom)}</h1>
    <p class="muted" style="margin-top:var(--s3);font-size:var(--t-sm)">
      Ce lien a été émis pour <strong style="color:var(--ink)">${esc(inv.email)}</strong>
      et n'ouvre qu'un seul compte.</p>
    <div class="card card--flat" style="background:var(--paper-sunk);border-color:transparent;margin-top:var(--s6)">
      <p style="font-size:var(--t-sm);color:var(--ink-700)">
        <strong>Ce que vous pourrez lire.</strong> Les indicateurs sociaux et de sécurité
        approuvés, site par site et consolidés ; les rapports trimestriels et annuel ; la
        participation des salariés en agrégat ; et le dictionnaire qui dit comment chaque
        chiffre est calculé.</p>
      <p style="font-size:var(--t-sm);color:var(--ink-600);margin-top:var(--s3)">
        <strong>Ce que vous ne verrez pas, jamais.</strong> Aucun nom de salarié, aucune mission
        individuelle, aucun don personnel, et aucun agrégat portant sur moins de cinq personnes.
        Ce n'est pas un réglage : un accès qui permettrait de savoir qui a fait quoi
        transformerait un droit d'information en outil de contrôle.</p>
      <p style="font-size:var(--t-sm);color:var(--ink-600);margin-top:var(--s3)">
        Riseva n'est pas la base de données économiques, sociales et environnementales de
        l'entreprise et ne s'y substitue pas.</p>
    </div>
    <form class="stack" style="--gap:var(--s4);margin-top:var(--s8)" id="fc">
      <div class="field"><label for="cnom">Nom et prénom</label>
        <input class="input" id="cnom" value="${esc(inv.nom || "")}" required autocomplete="name"></div>
      <div class="field"><label for="cmail">Email professionnel</label>
        <input class="input" id="cmail" type="email" value="${esc(inv.email || "")}" required autocomplete="email">
        <p class="hint">Ce lien n'accepte que l'adresse à laquelle il a été envoyé.</p></div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Accepter et ouvrir mon accès</button>
      <p class="hint center">Aucun mot de passe ici : vous recevrez un lien de connexion par mail.</p>
    </form>
  </div>`));

  boite.querySelector("#fc").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const mail = boite.querySelector("#cmail").value.trim().toLowerCase();
    if (mail !== String(inv.email || "").toLowerCase()){
      toast("Ce lien a été émis pour une autre adresse."); return;
    }
    let u;
    try { u = DB.accepterInvitationCSE(code); }
    catch (err){ toast(err.message); return; }
    try { localStorage.setItem("riseva.session", JSON.stringify({ uid: u.id })); } catch {}
    boite.innerHTML = "";
    boite.appendChild(h(`<div>
      <span class="badge badge--ok" style="height:28px"><span class="dot"></span>Accès ouvert</span>
      <h1 style="margin-top:var(--s5);font-size:var(--t-h2)">Bienvenue ${esc(u.nom.split(" ")[0])}</h1>
      <p class="muted" style="margin-top:var(--s4)">
        Vous lisez les chiffres de ${esc(ent.nom)}. Rien à saisir, rien à valider.</p>
      <a class="btn btn--primary btn--lg" style="margin-top:var(--s8)" href="/app/#/tableau">
        Ouvrir mon accès</a>
    </div>`));
  });
}
/* Un lien de référent est nominatif : il porte le nom et l'adresse de la personne
   visée. On les affiche, on ne les fait pas saisir, et surtout on n'accepte pas
   une autre adresse, sinon « nominatif » ne veut plus rien dire. */
else if (inv.pour_referent){
  boite.appendChild(h(`<div>
    <p class="eyebrow">Référent de site</p>
    <h1 style="margin-top:var(--s4);font-size:var(--t-h2)">Piloter ${esc(etab.nom)}, ${esc(etab.ville)}</h1>
    <p class="muted" style="margin-top:var(--s3);font-size:var(--t-sm)">
      ${esc(ent.nom)} vous confie ce site. Ce lien a été émis pour
      <strong style="color:var(--ink)">${esc(inv.email)}</strong> et n'ouvre qu'un seul compte.</p>
    <div class="card card--flat" style="background:var(--paper-sunk);border-color:transparent;margin-top:var(--s6)">
      <p style="font-size:var(--t-sm);color:var(--ink-700)">
        <strong>Ce que vous pourrez faire.</strong> Inviter les salariés de votre site, dans la
        limite des ${nb(etab.quota || 0)} places qui lui sont allouées ; voir ses missions et son
        score ; saisir ses indicateurs sociaux et de sécurité.</p>
      <p style="font-size:var(--t-sm);color:var(--ink-600);margin-top:var(--s3)">
        Ce que vous ne verrez pas : les autres sites, le contrat, les factures, le mécénat, ni
        les dons personnels de qui que ce soit.</p>
    </div>
    <form class="stack" style="--gap:var(--s4);margin-top:var(--s8)" id="fr">
      <div class="field"><label for="rnom">Nom et prénom</label>
        <input class="input" id="rnom" value="${esc(inv.nom || "")}" required autocomplete="name"></div>
      <div class="field"><label for="rmail">Email professionnel</label>
        <input class="input" id="rmail" type="email" value="${esc(inv.email || "")}" required autocomplete="email">
        <p class="hint">Ce lien n'accepte que l'adresse à laquelle il a été envoyé.</p></div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Accepter et créer mon compte</button>
      <p class="hint center">Aucun mot de passe ici : vous recevrez un lien de connexion par mail.</p>
    </form>
  </div>`));

  boite.querySelector("#fr").addEventListener("submit", (ev) => {
    ev.preventDefault();
    const mail = boite.querySelector("#rmail").value.trim().toLowerCase();
    if (mail !== String(inv.email || "").toLowerCase()){
      toast("Ce lien a été émis pour une autre adresse."); return;
    }
    let u;
    try { u = DB.accepterInvitationReferent(code); }
    catch (err){ toast(err.message); return; }
    try { localStorage.setItem("riseva.session", JSON.stringify({ uid: u.id })); } catch {}
    boite.innerHTML = "";
    boite.appendChild(h(`<div>
      <span class="badge badge--ok" style="height:28px"><span class="dot"></span>Compte créé</span>
      <h1 style="margin-top:var(--s5);font-size:var(--t-h2)">Bienvenue ${esc(u.nom.split(" ")[0])}</h1>
      <p class="muted" style="margin-top:var(--s4)">
        Vous pilotez ${esc(etab.nom)}, ${esc(etab.ville)}. Première chose à faire : créer le lien
        d'inscription de vos salariés.</p>
      <a class="btn btn--primary btn--lg" style="margin-top:var(--s8)" href="/app/#/tableau">
        Ouvrir mon tableau de bord</a>
    </div>`));
  });
}
else {
  boite.appendChild(h(`<div>
    <p class="eyebrow">Inscription</p>
    <h1 style="margin-top:var(--s4);font-size:var(--t-h2)">Rejoindre ${esc(ent.nom)}${etab ? `, ${esc(etab.ville)}` : ""}</h1>
    <p class="muted" style="margin-top:var(--s3);font-size:var(--t-sm)">
      ${restantesLien} place${restantesLien > 1 ? "s" : ""} encore disponible${restantesLien > 1 ? "s" : ""} sur ce lien${etab ? `, sur le quota de ${esc(etab.nom)}, ${esc(etab.ville)}` : ""}.</p>
    <form class="stack" style="--gap:var(--s4);margin-top:var(--s8)" id="f">
      <div class="field"><label for="nom">Nom et prénom</label>
        <input class="input" id="nom" required autocomplete="name"></div>
      <div class="field"><label for="mail">Email professionnel</label>
        <input class="input" id="mail" type="email" required autocomplete="email">
        ${DB.domaines(inv.entreprise).length
          ? `<p class="hint">Ce lien n'accepte que les adresses en @${DB.domaines(inv.entreprise).join(", @")}.</p>`
          : ""}</div>
      <!-- Pas de case « j'accepte » : la base légale retenue est l'intérêt légitime,
           pas le consentement. Un consentement qu'on ne peut pas refuser sans perdre
           l'accès n'est pas un consentement libre, le demander quand même, c'est se
           donner l'apparence de la conformité en la vidant. On informe, clairement,
           avant l'inscription, et on rappelle le droit d'opposition. -->
      <div class="card card--flat" style="background:var(--paper-sunk);border-color:transparent">
        <p style="font-size:var(--t-sm);color:var(--ink-700)">
          <strong>Ce que votre entreprise verra.</strong> Votre nom, les missions auxquelles vous
          participez et les points qu'elles rapportent. Elle ne verra jamais un don que vous faites
          de votre poche : ni le montant, ni l'association, ni votre nom en face.</p>
        <p style="font-size:var(--t-sm);color:var(--ink-600);margin-top:var(--s3)">
          Si vous quittez l'entreprise, votre compte est retiré et votre nom disparaît de la liste.
          Vous pouvez demander l'effacement complet à tout moment, et vous opposer au traitement :
          <a href="/confidentialite.html" target="_blank" style="color:var(--forest-800)">vos droits, en détail</a>.</p>
      </div>
      <button class="btn btn--primary btn--lg btn--block" type="submit">Créer mon compte</button>
      <p class="hint center">Aucun mot de passe ici : vous recevrez un lien de connexion par mail.</p>
    </form>
  </div>`));

  boite.querySelector("#f").addEventListener("submit", (e) => {
    e.preventDefault();
    const nom = boite.querySelector("#nom").value.trim();
    const mail = boite.querySelector("#mail").value.trim();
    let r;
    try { r = DB.rejoindre(code, nom, mail); }
    catch (err){ toast(err.message); return; }
    try { localStorage.setItem("riseva.session", JSON.stringify({ uid: r.utilisateur.id })); } catch {}
    boite.innerHTML = "";
    boite.appendChild(h(`<div>
      <span class="badge badge--ok" style="height:28px"><span class="dot"></span>Compte créé</span>
      <h1 style="margin-top:var(--s5);font-size:var(--t-h2)">Bienvenue ${esc(nom.split(" ")[0])}</h1>
      <p class="muted" style="margin-top:var(--s4)">
        Vous faites maintenant partie de l'équipe ${esc(r.entreprise.nom)} sur Riseva.
        Un lien de connexion vous a été envoyé sur ${esc(mail)}.</p>
      <a class="btn btn--primary btn--lg" style="margin-top:var(--s8)" href="/app/#/annonces">
        Voir les annonces</a>
    </div>`));
  });
}
</script>
</body>
</html>
