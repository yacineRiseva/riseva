<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riseva — page association</title>
<link rel="icon" href="/brand/riseva-mark.png">
<link rel="stylesheet" href="/styles/polices.css">
<link rel="stylesheet" href="/styles/tokens.css">
<link rel="stylesheet" href="/styles/base.css">
<link rel="stylesheet" href="/styles/components.css">
<link rel="stylesheet" href="/styles/marketing.css">
<link rel="stylesheet" href="/styles/app.css">
</head>
<body>
<header class="nav"><div class="wrap nav__in">
  <a href="/" class="logo"><img src="/brand/riseva-full.png" alt="Riseva"></a>
  <a class="btn btn--quiet btn--sm" href="/associations.html">Toutes les associations</a>
</div></header>

<main id="root"></main>

<footer class="foot"><div class="wrap between">
  <a href="/" class="logo"><img src="/brand/riseva-full.png" alt="Riseva" style="height:20px"></a>
  <span style="font-size:var(--t-xs);color:var(--ink-400)">© 2026 Riseva</span>
</div></footer>

<script type="module">
import { DB, BAREME, UNITES } from "/app/data.js";
import { h, esc, nb, eur, dateFR, toast } from "/app/ui.js";

const id = new URLSearchParams(location.search).get("id") || "a1";
const a = DB.association(id) || DB.associations()[0];
const annonces = DB.annonces({ asso: a.id, ouvertes: true });

const root = document.getElementById("root");
/* Cette page appartient à l'association, pas à Riseva. Son nom en grand, ses liens,
   son contact, et un bouton pour la partager : c'est une page qu'elle doit avoir
   envie de mettre dans sa lettre d'information. Riseva n'apparaît que comme tiers
   organisateur, et ce qu'elle a vérifié est écrit exactement, avec sa date. */
const hero = h(`<section class="assoHero"><div class="wrap">
  <p class="eyebrow">${esc(a.cause)} · ${esc(a.ville)}</p>
  <h1 class="display" style="margin-top:var(--s5);max-width:18ch">${esc(a.nom)}</h1>
  ${a.nom_juridique && a.nom_juridique !== a.nom
    ? `<p class="muted" style="margin-top:var(--s3);font-size:var(--t-sm)">${esc(a.nom_juridique)}${
        a.rna ? ` · RNA ${esc(a.rna)}` : ""}</p>` : ""}
  <p class="lede" style="margin-top:var(--s6)">${esc(a.resume)}</p>
  <div class="row" style="gap:var(--s3);flex-wrap:wrap;margin-top:var(--s6)">
    ${a.site ? `<a class="btn btn--ghost btn--sm" href="${esc(a.site)}" target="_blank"
       rel="noopener">Leur site</a>` : ""}
    ${(a.reseaux || []).map(r => `<a class="btn btn--quiet btn--sm" href="${esc(r.url)}"
       target="_blank" rel="noopener">${esc(r.nom)}</a>`).join("")}
    ${a.contact_public ? `<a class="btn btn--quiet btn--sm"
       href="mailto:${esc(a.contact_public)}">Les contacter</a>` : ""}
    <button class="btn btn--quiet btn--sm" id="partager">Partager cette page</button>
  </div>
  ${a.verifiee_le ? `<p class="hint" style="margin-top:var(--s6);max-width:62ch">
    Riseva a vérifié le ${dateFR(a.verifiee_le)} l'existence juridique de l'association, l'identité
    de son référent, la cohérence de son objet et ses coordonnées.
    <a href="/charte-associations.html" style="color:var(--forest-800)">Ce que Riseva vérifie</a> —
    et ce qu'elle ne vérifie pas : l'éligibilité fiscale et l'impact des missions.</p>` : ""}
</div></section>`);
root.appendChild(hero);
hero.querySelector("#partager").onclick = async (ev) => {
  const lien = location.href;
  if (navigator.share){ try { await navigator.share({ title: a.nom, url: lien }); return; } catch {} }
  try { await navigator.clipboard.writeText(lien); toast("Lien copié."); }
  catch { ev.target.textContent = lien; }
};

/* Ce que cette association a déjà obtenu grâce au réseau : c'est ce qui donne envie
   de donner, bien plus qu'un discours. */
const rea = DB.realisations({ asso: a.id });
if (rea.liste.length){
  root.appendChild(h(`<section class="section section--dark grain" style="padding-block:var(--s16)">
    <div class="wrap">
      ${/* « Grâce au réseau Riseva » attribuait à la plateforme le travail de
            l'association. Elle réalise, l'entreprise apporte des moyens, Riseva
            organise la rencontre — et c'est tout. */""}
      <p class="eyebrow">Résultats déclarés par ${esc(a.nom)}</p>
      <div class="realis__grid" style="margin-top:var(--s8)">
        ${rea.liste.map(x => `<div class="realis__c">
          <span class="realis__n">${nb(Math.round(x.quantite))}</span>
          <span class="realis__l">${esc(x.pl)}</span></div>`).join("")}
      </div>
      <p class="hint" style="margin-top:var(--s8)">
        Réalisés par ${esc(a.nom)} avec le concours de salariés d'entreprises abonnées, sur
        ${rea.missions} mission${rea.missions > 1 ? "s" : ""} confirmée${rea.missions > 1 ? "s" : ""}
        par l'association elle-même.</p>
    </div>
  </section>`));
}

/* Les coordonnées bancaires viennent du moteur, jamais du gabarit : une page
   publique qui composerait elle-même un IBAN finirait par en afficher un faux. */
const don = DB.coordonneesDon(a.id) || {};
const ha = DB.lienHelloAsso(a.id);

const corps = h(`<section class="section"><div class="wrap assoGrid">
  <div>
    <h2>Leurs besoins en ce moment</h2>
    <div class="card" style="margin-top:var(--s6)" id="liste"></div>
  </div>
  <aside class="card" style="padding:var(--s8);position:sticky;top:88px">
    ${DB.donsOuverts(a.id) ? `
      <h3>Lui donner de l'argent</h3>
      ${ha ? `<a class="btn btn--brand btn--block" style="margin-top:var(--s5)" target="_blank"
         rel="noopener noreferrer" href="${esc(ha)}">Donner par carte</a>
      <p class="hint center" style="margin-top:var(--s3)">Par HelloAsso, sans commission.
        L'argent va directement à ${esc(a.nom)}.</p>
      <hr class="sep">
      <p class="muted" style="font-size:var(--t-sm)"><strong>Ou par virement</strong></p>` : ""}
      <p class="muted" style="font-size:var(--t-sm);margin-top:var(--s3)">
        Par virement, directement sur le compte de ${esc(a.nom)}.
        <strong>Riseva n'encaisse rien</strong> et ne prélève rien : l'argent va de votre banque
        à la sienne, sans intermédiaire, et elle touche la totalité de votre don.</p>
      <div class="card card--flat" style="padding:var(--s5);margin-top:var(--s5)">
        <p class="muted" style="font-size:var(--t-sm)">Titulaire du compte</p>
        <strong>${esc(don.titulaire)}</strong>
        <p class="muted" style="font-size:var(--t-sm);margin-top:var(--s4)">IBAN</p>
        <div style="font-family:var(--font-mono);font-size:var(--t-sm);word-break:break-all">${esc(don.iban_lisible)}</div>
        ${don.bic ? `<p class="muted" style="font-size:var(--t-sm);margin-top:var(--s3)">BIC ${esc(don.bic)}</p>` : ""}
      </div>
      <p class="hint" style="margin-top:var(--s4)">Vérifiez le nom du bénéficiaire affiché par
        votre banque : il doit correspondre à celui-ci. C'est le seul contrôle qui protège
        vraiment d'un virement détourné.</p>
      <hr class="sep">
      <p class="muted" style="font-size:var(--t-sm)">
        <strong>Le reçu fiscal</strong> est délivré par ${esc(a.nom)}, seule habilitée à le faire.
        Pour un don fait ici, demandez-le-lui directement.</p>
      <p class="muted" style="font-size:var(--t-sm);margin-top:var(--s3)">
        Si votre entreprise est abonnée à Riseva, passez plutôt par votre espace : le don porte
        alors une référence, il compte dans le score de votre entreprise, et le reçu est préparé
        automatiquement.</p>
    ` : `
      <span class="badge badge--warn">Pas encore</span>
      <h3 style="margin-top:var(--s4)">Le don en argent n'est pas ouvert ici</h3>
      <p class="muted" style="font-size:var(--t-sm);margin-top:var(--s3)">
        ${esc(a.nom)} n'a pas encore renseigné le compte sur lequel recevoir des virements.
        Riseva n'encaisse pas à sa place : sans son IBAN, il n'y a nulle part où envoyer
        l'argent, et un bouton « Donner » ici serait un bouton qui ne mène nulle part.</p>
      <hr class="sep">
      <p class="muted" style="font-size:var(--t-sm)">
        D'ici là, ${esc(a.nom)} reçoit du temps et du matériel par Riseva. Pour lui donner de
        l'argent, passez par ses propres moyens de collecte.</p>
    `}
  </aside>
</div></section>`);
root.appendChild(corps);

const liste = corps.querySelector("#liste");
if (!annonces.length) liste.appendChild(h(`<p class="empty">Aucun besoin publié pour le moment.</p>`));
annonces.forEach(an => {
  const b = BAREME[an.type];
  const imp = an.impact && UNITES[an.impact.unite] ? an.impact : null;
  /* L'objectif complet, pas le multiplicateur par unité : « 40 arbres plantés »
     sous un titre qui en annonce 400, ou pire « 0 arbres plantés » sur un don
     financier, se lisait comme un bilan raté au lieu d'un objectif. */
  const objectif = imp ? Math.round(an.quantite * imp.par_unite) : 0;
  liste.appendChild(h(`<article class="offer">
    <div>
      <div class="row" style="gap:var(--s3);flex-wrap:wrap">
        <span class="badge badge--brand">${esc(b.label)}</span>
        ${imp && objectif > 0 ? `<span class="badge" title="Objectif annoncé par l'association">Objectif : ${nb(objectif)} ${esc(UNITES[imp.unite].pl)}</span>` : ""}
        <span class="muted" style="font-size:var(--t-sm)">${dateFR(an.date)}</span>
      </div>
      <h4 style="margin-top:var(--s3)">${esc(an.titre)}</h4>
      <p>${esc(an.description)}</p>
      <div class="offer__meta"><span>${esc(an.lieu)}</span><span>·</span>
        <span>${an.type === "don_financier" ? eur(an.restant) + " restants" : an.restant + (an.restant > 1 ? " places" : " place")}</span></div>
    </div>
    <div class="offer__side">
      <span class="offer__pts">${an.type === "don_financier" ? b.points + " pt / 10 €" : nb(b.points) + " pts"}</span>
    </div>
  </article>`));
});

</script>
</body>
</html>
